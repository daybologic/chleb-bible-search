openapi: 3.0.0
info:
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Chleb Bible Search
  description: Query the bible, or get a verse of the day.
  version: 3.2.0
servers:
  - url: /
    description: This server
  - url: https://chleb-api.daybologic.co.uk
    description: Published API, production
paths:
  /openapi.yaml:
    get:
      summary: Get the OpenAPI document in YAML format
      operationId: getOpenapiYaml
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 document
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: OpenAPI document not found
  /openapi.json:
    get:
      summary: Get the OpenAPI document in JSON format
      operationId: getOpenapiJson
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 document
          content:
            application/json:
              schema:
                type: object
        '404':
          description: OpenAPI document not found
  /docs:
    get:
      summary: Get interactive HTML API documentation
      operationId: getOpenapiDocs
      security: []
      responses:
        '200':
          description: Swagger UI documentation
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: object
            text/html:
              schema:
                type: string
        '404':
          description: Documentation page not found
  /1/test/http/{statusCode}:
    get:
      summary: Generate a registered HTTP error
      operationId: getTestHttpError
      description: Deliberately return any registered, non-obsolete HTTP client or server error to test handling, content negotiation, protocol headers, and monitoring
      security: [] # No security
      parameters:
        - name: statusCode
          in: path
          required: true
          description: Registered HTTP error status to return
          schema:
            type: integer
            enum: [400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 421, 422, 423, 424, 425, 426, 428, 429, 431, 451, 500, 501, 502, 503, 504, 505, 506, 507, 508, 511]
      responses:
        '400':
          $ref: '#/components/responses/TestHttpError'
        '401':
          $ref: '#/components/responses/TestHttpError'
        '402':
          $ref: '#/components/responses/TestHttpError'
        '403':
          $ref: '#/components/responses/TestHttpError'
        '404':
          $ref: '#/components/responses/TestHttpError'
        '405':
          $ref: '#/components/responses/TestHttpError'
        '406':
          $ref: '#/components/responses/TestHttpError'
        '407':
          $ref: '#/components/responses/TestHttpError'
        '408':
          $ref: '#/components/responses/TestHttpError'
        '409':
          $ref: '#/components/responses/TestHttpError'
        '410':
          $ref: '#/components/responses/TestHttpError'
        '411':
          $ref: '#/components/responses/TestHttpError'
        '412':
          $ref: '#/components/responses/TestHttpError'
        '413':
          $ref: '#/components/responses/TestHttpError'
        '414':
          $ref: '#/components/responses/TestHttpError'
        '415':
          $ref: '#/components/responses/TestHttpError'
        '416':
          $ref: '#/components/responses/TestHttpError'
        '417':
          $ref: '#/components/responses/TestHttpError'
        '421':
          $ref: '#/components/responses/TestHttpError'
        '422':
          $ref: '#/components/responses/TestHttpError'
        '423':
          $ref: '#/components/responses/TestHttpError'
        '424':
          $ref: '#/components/responses/TestHttpError'
        '425':
          $ref: '#/components/responses/TestHttpError'
        '426':
          $ref: '#/components/responses/TestHttpError'
        '428':
          $ref: '#/components/responses/TestHttpError'
        '429':
          $ref: '#/components/responses/TestHttpError'
        '431':
          $ref: '#/components/responses/TestHttpError'
        '451':
          $ref: '#/components/responses/TestHttpError'
        '500':
          $ref: '#/components/responses/TestHttpError'
        '501':
          $ref: '#/components/responses/TestHttpError'
        '502':
          $ref: '#/components/responses/TestHttpError'
        '503':
          $ref: '#/components/responses/TestHttpError'
        '504':
          $ref: '#/components/responses/TestHttpError'
        '505':
          $ref: '#/components/responses/TestHttpError'
        '506':
          $ref: '#/components/responses/TestHttpError'
        '507':
          $ref: '#/components/responses/TestHttpError'
        '508':
          $ref: '#/components/responses/TestHttpError'
        '511':
          $ref: '#/components/responses/TestHttpError'
  /1/info:
    get:
      summary: Get global facts
      operationId: getInfo
      description: Get cachable information about translations, books, chapters, and verses available
      security: [] # No security
      responses:
        '200':
          description: Successfully retrieved info
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Info'
                  included:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Bible'
                        - $ref: '#/components/schemas/Book'
                        - $ref: '#/components/schemas/Chapter'
                        - $ref: '#/components/schemas/Stats'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
  /1/uptime:
    get:
      summary: Get server uptime
      operationId: getUptime
      description: The server uptime, as opposed to the service, ie. if the service is clustered, this value may not be a monotonically increasing number
      security: [] # No security
      responses:
        '200':
          description: Successfully retrieved server uptime
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Uptime'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
  /1/ping:
    get:
      summary: Ping the server to check if it is alive
      operationId: getPing
      description: Ping the server just to receive a very simple response, to check if it alive, with low overhead
      security: [] # No security
      responses:
        '200':
          description: Successfully retrieved pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pong'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
  /1/version:
    get:
      summary: Get server version
      operationId: getVersion
      description: Get the version from the server.  The operation may be restricted by the server administrator
      security: [] # No security
      responses:
        '200':
          description: Successfully retrieved server version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Version'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/html:
              schema:
                type: string
        '403':
          description: Forbidden
        '429':
          $ref: '#/components/responses/RateLimited'
  /2/random:
    get:
      summary: Random Verse
      operationId: getRandom2
      description: Retrieve one or more verses from The Bible, at random.
      parameters:
        - in: query
          name: translations
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Translation'
          required: false
          style: form
          explode: false
          description: Requested/accepted bible translations
        - in: query
          name: testament
          schema:
            type: string
            enum:
              - any
              - old
              - new
            default: any
          required: false
          description: Only retrieve a verse from the given testament
        - in: query
          name: parental
          schema:
            type: boolean
            default: false
          required: false
          description: Skip over verse if it is marked as sensitive in the server configuration file, and return the next alternative
      security: [] # No security
      responses:
        '200':
          description: Successfully retrieved verses
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Verse'
                  included:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Book'
                        - $ref: '#/components/schemas/Chapter'
                        - $ref: '#/components/schemas/Stats'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal Server Error
        '502':
          description: Bad gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
  /2/votd:
    get:
      summary: Verse(s) of The Day
      operationId: getVotd2
      description: Retrieve a series of verses from The Bible, for the given day
      parameters:
        - in: query
          name: when
          schema:
            type: string
            default: (current date)
            example: 2024-07-29T23:35:31+0100
          required: false
          description: Date in ISO-8601, for viewing previous verses of the day
        - in: query
          name: date
          schema:
            type: string
            format: date
            example: 2026-07-28
          required: false
          description: Date-picker fallback used by form mode; converted to midnight UTC when when is absent
        - in: query
          name: form
          schema:
            type: boolean
            default: false
          required: false
          description: In text/html mode, display the date picker and VoTD result cards on the same page
        - in: query
          name: parental
          schema:
            type: boolean
            default: false
          required: false
          description: Skip over verse if it is marked as sensitive in the server configuration file, and return the next alternative
        - in: query
          name: translations
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Translation'
          required: false
          style: form
          explode: false
          description: Requested/accepted bible translations
        - in: query
          name: testament
          schema:
            type: string
            enum:
              - any
              - old
              - new
            default: any
          required: false
          description: Only retrieve a verse from the given testament
      security: [] # No security
      responses:
        '200':
          description: Successfully retrieved verse
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Verse'
                  suggestions:
                    type: array
                    maxItems: 5
                    items:
                      type: string
                    description: >-
                      Up to five Bible words with the smallest Levenshtein
                      distance from the requested term. This property is
                      present only for JSON searches that return no results.
                  included:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Book'
                        - $ref: '#/components/schemas/Chapter'
                        - $ref: '#/components/schemas/Stats'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal Server Error
        '502':
          description: Bad gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
  /1/search:
    get:
      summary: Bible search
      operationId: search
      description: >-
        Search for criteria in the whole bible. Ordinary searches may also
        match translation-specific thesaurus terms, so equivalent wording
        used by a selected translation can be found. Set `wholeword` to true
        to require an exact whole-word match without thesaurus expansion.
      parameters:
        - in: query
          name: form
          schema:
            type: boolean
          required: false
          description: In text/html mode, display a form, and pre-fill values from your query
        - in: query
          name: term
          schema:
            type: string
          required: false
          description: >-
            Criterion for search, not required if you want the form mode, which
            is only valid in text/html mode. Ordinary searches may include
            related thesaurus terms; use `wholeword` for an exact whole-word
            search.
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
          required: false
          description: Maximum number of total search results to consider before pagination
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          required: false
          description: Requested result page. Values below 1 are treated as page 1.
        - in: query
          name: per_page
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 2000
          required: false
          description: Number of search results to return on this page
        - in: query
          name: wholeword
          schema:
            type: boolean
            default: false
          required: false
          description: Require an exact whole-word match, with whitespace or end of verse after the requested term; disables thesaurus expansion
        - in: query
          name: translations
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Translation'
          required: false
          style: form
          explode: false
          description: Requested/accepted bible translations
      security: [] # No security
      responses:
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Verse'
                  included:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Book'
                        - $ref: '#/components/schemas/Chapter'
                        - $ref: '#/components/schemas/SearchResultsSummary'
                        - $ref: '#/components/schemas/Stats'
                  links:
                    $ref: '#/components/schemas/JsonApiLinks'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
            text/x-yaml:
              schema:
                $ref: '#/components/schemas/JsonApiDocument'
        '400':
          description: Bad request
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal Server Error
        '502':
          description: Bad gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
  /1/lookup:
    get:
      summary: Bible lookup via query params
      operationId: getVerseViaQuery
      description: Look up a specific verse via query parameters - a compatibility route, for form-submission only.  Please use the /1/lookup/{book}/{chapter}/{verse} route where possible, all parameters supported there, are implicitly supported here, but if you use this route, you will encounter and need to handle a redirect (307).
      parameters:
        - in: query
          name: book
          schema:
            oneOf:
              - type: string
              - type: integer
          required: false
          description: >-
            Book of the Bible. Use a long name such as `John`, a short name such
            as `john`, or its ordinal such as `43`.
          examples:
            longName:
              summary: Long book name
              value: John
            shortName:
              summary: Short book name
              value: john
            ordinal:
              summary: Book ordinal
              value: 43
        - in: query
          name: chapter
          schema:
            type: integer
          required: false
          description: Chapter within book (ordinal), for example `3` for John chapter 3
          example: 3
        - in: query
          name: verse
          schema:
            type: integer
          required: false
          description: Verse within chapter (ordinal), for example `16` for John 3:16
          example: 16
        - in: query
          name: translations
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Translation'
          required: false
          style: form
          explode: false
          description: Requested/accepted bible translations
        - in: query
          name: form
          schema:
            type: boolean
            default: false
          required: false
          description: In text/html mode, display the lookup form
        - in: query
          name: navigation
          schema:
            type: boolean
            default: false
          required: false
          description: Redirect to the lookup URL for the selected translation
        - in: query
          name: submit
          schema:
            type: string
          required: false
          description: Form submit action; use `lookup` to perform the compatibility lookup
      security: [] # No security
      responses:
        '200':
          description: Search form or lookup form
          content:
            text/html:
              schema:
                type: string
        '307':
          description: Temporary redirect
        '400':
          description: Bad request
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal Server Error
        '502':
          description: Bad gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
  /1/lookup/{book}/{chapter}:
    get:
      summary: Bible chapter lookup
      operationId: getChapterVerses
      description: Look up a specific chapter's verses
      parameters:
        - in: path
          name: book
          schema:
            oneOf:
              - type: string
              - type: integer
          required: true
          description: >-
            Book of the Bible. Use a long name such as `John`, a short name such
            as `john`, or its ordinal such as `43`.
          examples:
            longName:
              summary: Long book name
              value: John
            shortName:
              summary: Short book name
              value: john
            ordinal:
              summary: Book ordinal
              value: 43
        - in: path
          name: chapter
          schema:
            type: integer
          required: true
          description: Chapter within book (ordinal), for example `3` for John chapter 3
          example: 3
        - in: query
          name: translations
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Translation'
          required: false
          style: form
          explode: false
          description: Requested/accepted bible translations
      security: [] # No security
      responses:
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupDocument'
            application/vnd.api+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupDocument'
            text/x-yaml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupDocument'
        '400':
          description: Bad request
        '404':
          description: Verse not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal Server Error
        '502':
          description: Bad gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
  /1/lookup/{book}/{chapter}/{verse}:
    get:
      summary: Bible verse lookup
      operationId: getVerse
      description: Look up a specific verse
      parameters:
        - in: path
          name: book
          schema:
            oneOf:
              - type: string
              - type: integer
          required: true
          description: >-
            Book of the Bible. Use a long name such as `John`, a short name such
            as `john`, or its ordinal such as `43`.
          examples:
            longName:
              summary: Long book name
              value: John
            shortName:
              summary: Short book name
              value: john
            ordinal:
              summary: Book ordinal
              value: 43
        - in: path
          name: chapter
          schema:
            type: integer
          required: true
          description: Chapter within book (ordinal), for example `3` for John chapter 3
          example: 3
        - in: path
          name: verse
          schema:
            type: string
            pattern: '^-?\d+$|^\d+-\d+$'
          required: true
          description: >-
            Verse within chapter (ordinal), for example `16` for John 3:16, or
            an ascending range such as `9-10` for John 3:9-10.
          examples:
            single:
              summary: Single verse
              value: '16'
            range:
              summary: Ascending verse range
              value: '9-10'
        - in: query
          name: translations
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Translation'
          required: false
          style: form
          explode: false
          description: Requested/accepted bible translations
      security: [] # No security
      responses:
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupDocument'
            application/vnd.api+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupDocument'
            text/x-yaml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupDocument'
        '400':
          description: Bad request
        '404':
          description: Verse not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal Server Error
        '502':
          description: Bad gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
components:
  responses:
    TestHttpError:
      description: Deliberate registered HTTP error response. Status-specific protocol headers are included where applicable.
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
              title:
                type: string
              message:
                type: string
              exception:
                type: string
    RateLimited:
      description: Rate-limited
      headers:
        Retry-After:
          description: Number of seconds the client should wait before retrying.
          schema:
            type: integer
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
  schemas:
    JsonApiDocument:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: JSON:API primary data
          items:
            type: object
        included:
          type: array
          description: Related resources included in the document
          items:
            type: object
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    LookupDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Verse'
        included:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Book'
              - $ref: '#/components/schemas/Chapter'
              - $ref: '#/components/schemas/Stats'
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    Bible:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["bible"]
        attributes:
          type: object
          properties:
            book_count:
              type: integer
            book_names_long:
              type: array
              items:
                type: string
            book_names_short:
              type: array
              items:
                type: string
            book_names_short_raw:
              type: array
              items:
                type: string
            translation:
              $ref: '#/components/schemas/Translation'
            verse_count:
              type: integer
            year:
              type: integer
    JsonApiErrorDocument:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiError'
    JsonApiError:
      type: object
      properties:
        detail:
          type: string
          example: Request rate exceeded for this session
        status:
          type: string
          example: "429"
        title:
          type: string
          example: Too Many Requests
    Book:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["book"]
        attributes:
          type: object
          properties:
            chapter_count:
              type: integer
              example: 28
            verse_count:
              type: integer
              example: 1071
            long_name:
              type: string
              example: "Matthew"
            testament:
              type: string
              enum: ["old", "new"]
            short_name:
              type: string
              example: "mat"
            translation:
              type: string
              example: "kjv"
            ordinal:
              type: integer
              example: 4
            sample_verse_text:
              type: string
              example: "The gates of the rivers shall be opened, and the palace shall be dissolved."
            sample_verse_chapter_ordinal:
              description: Which chapter the sample verse (sample_verse_text) came from
              type: integer
              example: 1
            sample_verse_ordinal_in_chapter:
              description: The sample_verse_text verse number within a the chapter (sample_verse_chapter_ordinal).
              type: integer
              example: 1
            short_name_raw:
              type: string
              example: "Mat"
            canonical_code:
              description: Canonical book code shared by equivalent books across translations.
              type: string
              example: "Rev"
    Chapter:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["chapter"]
        attributes:
          type: object
          properties:
            book:
              type: string
              example: "rev"
            verse_count:
              type: integer
              example: 404
            translation:
              type: string
              example: "asv"
            ordinal:
              type: integer
              example: 13
    Info:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["info"]
        attributes:
          type: object
          properties:
            book_count:
              type: integer
              description: How many unique books available to query, across all translations, ie. could be more than 66 depending on translations loaded
              example: 66
            book_names_long:
              type: array
              items:
                type: string
                description: The full name of the book, arbitary length
                example: II Corinthians
            book_names_short:
              type: array
              items:
                type: string
                description: The short name of the book, which is used in all REST-related queries
                example: 2cor
            book_names_short_raw:
              type: array
              items:
                type: string
                description: The short name of the book, which is used for logging, backend lookups in the database, verse attributions
                example: 2Cor
            translation_count:
              type: integer
              description: How many translations are immediately available, includes free and plugin translations
              example: 2
            translations:
              type: array
              items:
                type: string
                description: Translations immediately available such as 'asv', 'kjv', and any additional translations loaded dynamically into the server, the reserved words 'any' and 'all' are not listed but are always available.
                example: asv
    Version:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["version"]
        attributes:
          type: object
          properties:
            version:
              type: string
              description: Version string in opaque, non-processable format
              example: 1.2.3-prerelease
            changeset:
              type: string
              description: Git changeset captured when this build was created
              example: 7f4c2d4d9f0a
            branch:
              type: string
              description: Git branch captured when this build was created
              example: master
            build_time:
              type: string
              description: Build timestamp captured when this build was created
              example: 2026-06-18T08:06:34+0000
            build_host:
              type: string
              description: Hostname where this build was created
              example: grable.daybologic.co.uk
            build_os:
              type: string
              description: Operating system where this build was created
              example: GNU/Linux
            build_arch:
              type: string
              description: Architecture where this build was created
              example: x86_64
            build_user:
              type: string
              description: User which created this build
              example: palmer
            perl_version:
              type: string
              description: Perl version used when this build was created
              example: v5.40.1 (5.040001)
            admin_email:
              type: string
              description: Email address to contact the server administrator
              example: example@example.org
            admin_name:
              type: string
              description: Nam of the server administrator
              example: Rev. Duncan Ross Palmer
            server_host:
              type: string
              description: Machine name
              example: sprat.example.org
    Pong:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["pong"]
        attributes:
          type: object
          properties:
            message:
              type: string
              description: a message whose content doesn't really matter
              example: Ahoy-hoy!
    Uptime:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["uptime"]
        attributes:
          type: object
          properties:
            uptime:
              type: integer
              description: Number of seconds since startup
              example: 90
            text:
              type: string
              description: Description of uptime in human-readable text
              example: 1 minute and 30 seconds
    Translation:
      type: string
      default: "kjv"
      description: Translation code, or the reserved value "all". Additional translation codes may be installed dynamically.
      example: "kjv"
    Verse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["verse"]
        attributes:
          type: object
          properties:
            book:
              type: string
              description: Book in which this verse appears
              example: "Gen"
            chapter:
              type: integer
              description: Chapter number in which verse appears
              example: 6
            emotion:
              type: string
              description: Primary emotional sentiment of the verse
              example: "hope"
            ordinal:
              type: integer
              description: Verse number within chapter
              example: 22
            text:
              type: string
              description: Verbatim and unedited text from the Holy Bible.
              example: Thus did Noah; according to all that God commanded him, so did he.
            tones:
              type: array
              items:
                type: string
                description: Additional sentiment(s) detected for the verse
                example: encouragement
            translation:
              $ref: '#/components/schemas/Translation'
            year:
              type: integer
              description: Publication year of the translation
              example: 1611
    Stats:
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
          properties:
            msec:
              type: integer
              description: ms for core request resolution, without overhead, for debugging core algorithm degradation and loading only
              example: 189
    SearchResultsSummary:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["results_summary"]
        attributes:
          type: object
          properties:
            count:
              type: integer
              description: Number of results returned on this page
              example: 50
            page:
              type: integer
              description: Current page number after normalisation
              example: 2
            per_page:
              type: integer
              description: Number of results requested per page after normalisation
              example: 50
            total_count:
              type: integer
              description: Total number of results considered after applying the search limit
              example: 153
            total_pages:
              type: integer
              description: Total number of pages available for the current search
              example: 4
        links:
          type: object
    JsonApiLinks:
      type: object
      properties:
        first:
          type: string
          description: URL for the first page of search results
          example: /1/search?term=peter&wholeword=1&limit=153&page=1&per_page=50
        last:
          type: string
          description: URL for the last page of search results
          example: /1/search?term=peter&wholeword=1&limit=153&page=4&per_page=50
        self:
          type: string
          description: URL for the current page of search results
          example: /1/search?term=peter&wholeword=1&limit=153&page=2&per_page=50
        yesterday:
          type: string
          description: URL for the previous verse of the day
          example: /2/votd?when=2024-08-22T00:00:00+0000
        tomorrow:
          type: string
          description: URL for the following verse of the day
          example: /2/votd?when=2024-08-24T00:00:00+0000
        prev:
          type: string
          description: URL for the previous page of search results, omitted on the first page
          example: /1/search?term=peter&wholeword=1&limit=153&page=1&per_page=50
        next:
          type: string
          description: URL for the next page of search results, omitted on the last page
          example: /1/search?term=peter&wholeword=1&limit=153&page=3&per_page=50
